name: Feature request
description: Share ideas for new features

body:
  - type: markdown
    attributes:
      value: |
        **AI WARNING**: if you intend to submit AI-generated content, put particular attention:
        - Make sure to fully understand the content you are submitting, since you might be required to justify it.
        - Make sure that the content is as simple as possible and fully understandable by humans too.

  - type: markdown
    attributes:
      value: |
        Please create a request FOR EACH feature. Do not report multiple features in a single request, otherwise they'll probably never get all implemented.

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
    validations:
      required: true
